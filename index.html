<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AuditBot Móvil - Sesión 1</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f3f3f3;color:#161616}
.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.top{background:#111;color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:2}
.brand{font-size:12px;letter-spacing:1px;opacity:.75}.title{font-size:20px;font-weight:800;margin-top:4px}
.sub{font-size:13px;margin-top:4px;opacity:.8}.progress{height:5px;background:#444;margin-top:12px;border-radius:8px;overflow:hidden}
.bar{height:100%;width:10%;background:#fff;transition:.3s}
.chat{padding:16px;flex:1}.bubble{padding:13px 14px;margin:10px 0;border-radius:15px;line-height:1.45;font-size:15px}
.bot{background:#f0f0f0;border-bottom-left-radius:4px}.me{background:#111;color:#fff;margin-left:35px;border-bottom-right-radius:4px}
.actions{padding:12px 16px 22px;display:grid;gap:9px}
button{width:100%;padding:13px 12px;border:1px solid #222;border-radius:12px;background:#fff;font-size:14px;font-weight:700;text-align:left}
button:active{background:#111;color:#fff}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:bold}
.footer{text-align:center;font-size:11px;color:#777;padding:0 10px 14px}
</style>
</head>
<body><div class="app">
<div class="top"><div class="brand">UPN · CONTABILIDAD Y FINANZAS</div><div class="title">🤖 AuditBot</div>
<div class="sub">Auditoría Financiera 2 · Sesión 1</div><div class="progress"><div class="bar" id="bar"></div></div></div>
<div class="chat" id="chat"></div><div class="actions" id="actions"></div>
<div class="footer">Recurso académico de introducción y autoaprendizaje</div></div>
<script>
let step=1; const chat=document.getElementById("chat"), act=document.getElementById("actions"), bar=document.getElementById("bar");
function bot(x){chat.innerHTML+=`<div class="bubble bot">${x}</div>`;down()}
function me(x){chat.innerHTML+=`<div class="bubble me">${x}</div>`;down()}
function down(){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),80)}
function prog(n){bar.style.width=Math.min(100,n*16)+"%"}
function opts(a,fn){act.innerHTML="";a.forEach(x=>{let b=document.createElement("button");b.innerHTML=x;b.onclick=()=>{me(b.textContent);act.innerHTML="";fn(x)};act.appendChild(b)})}
function start(){prog(1);bot("<span class='tag'>Bienvenida</span><br><br>👋 ¡Hola! Soy <b>AuditBot</b>. Hoy iniciaremos Auditoría Financiera 2 con un pequeño caso.");bot("Una empresa solicita un préstamo de <b>S/ 2 millones</b>. El banco quiere confiar en sus estados financieros.<br><br>¿Quién podría aportar mayor confianza sobre esa información?");opts(["A. El contador","B. El gerente general","C. Un auditor externo independiente","D. El administrador"],q1)}
function q1(x){prog(2);if(x.startsWith("C"))bot("✅ <b>¡Muy bien!</b> La independencia del auditor externo permite aportar credibilidad a la información financiera.");else bot("La respuesta esperada es <b>C. Un auditor externo independiente</b>. Esta idea nos introduce al tema central de hoy.");bot("¿Qué te gustaría descubrir primero?");opts(["🔎 ¿Qué es la auditoría financiera externa?","🎯 ¿Cuáles son sus objetivos?","💡 ¿Por qué es importante?","📚 Normas Internacionales de Auditoría"],topic)}
function topic(x){prog(3);if(x.includes("Qué es"))bot("<b>Auditoría Financiera Externa Independiente:</b> es el examen realizado por un profesional independiente sobre la información financiera para sustentar una opinión profesional.");
else if(x.includes("objetivos"))bot("<b>Objetivo:</b> aportar confianza a los usuarios de los estados financieros mediante el trabajo y la opinión del auditor independiente.");
else if(x.includes("importante"))bot("<b>Importancia:</b> contribuye a que bancos, inversionistas y otros usuarios puedan tomar decisiones con mayor confianza en la información examinada.");
else bot("<b>NIA:</b> son normas que orientan el trabajo del auditor financiero, desde la planificación y obtención de evidencia hasta la formación de su opinión.");
bot("Ahora comprobemos lo aprendido 👇");opts(["🧠 Iniciar mini reto"],quiz)}
function quiz(){prog(4);bot("<b>Pregunta 1 de 2</b><br><br>¿Cuál es una característica esencial del auditor externo?");opts(["A. Independencia","B. Ser empleado de la empresa","C. Registrar todas las ventas","D. Autorizar los pagos"],ans)}
function ans(x){if(x.startsWith("A"))bot("✅ Correcto. La <b>independencia</b> es esencial para la objetividad y credibilidad del trabajo.");else bot("❌ La respuesta esperada es <b>A. Independencia</b>.");prog(5);bot("<b>Pregunta 2 de 2</b><br><br>¿La auditoría externa reemplaza la responsabilidad de la empresa sobre sus estados financieros?");opts(["Sí","No"],ans2)}
function ans2(x){if(x=="No")bot("✅ Correcto. La auditoría externa no sustituye la responsabilidad de la empresa.");else bot("La respuesta esperada es <b>No</b>. La auditoría examina la información, pero no sustituye la responsabilidad de la empresa.");prog(6);bot("🎯 <b>¡Sesión introductoria completada!</b><br><br>Ya tienes una primera aproximación a la auditoría financiera externa independiente, sus objetivos, importancia y las NIA.");opts(["↻ Volver a empezar"],()=>location.reload())}
start();
</script></body></html>
